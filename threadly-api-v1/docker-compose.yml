services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: threadly
      POSTGRES_PASSWORD: threadly_dev_password
      POSTGRES_DB: threadly
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threadly -d threadly"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:

