app:
  name: threadly-api
  environment: production

http:
  host: 0.0.0.0
  port: 8080
  read_timeout: 10s
  write_timeout: 15s
  idle_timeout: 60s

databases:
  primary:
    max_conns: 20
    min_conns: 2
    max_conn_lifetime: 1h
    max_conn_idle_time: 30m

  analytics:
    max_conns: 5
    min_conns: 1
    max_conn_lifetime: 1h
    max_conn_idle_time: 30m

redis:
  host: localhost
  port: 6379
  database: 0
