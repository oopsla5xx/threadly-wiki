app:
  name: threadly-api

http:
  host: 0.0.0.0
  port: 8080
  read_timeout: 10s
  write_timeout: 15s
  idle_timeout: 60s
  shutdown_timeout: 10s

log:
  level: info
  format: json
  outputs: [stdout]
  file:
    path: /var/log/threadly/app.log
    max_size_mb: 500
    max_backups: 3
    max_age_days: 28
    compress: true

databases:
  primary:
    max_conns: 10
    min_conns: 2
    max_conn_lifetime: 1h
    max_conn_idle_time: 30m

redis:
  db: 0
  pool_size: 10
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
